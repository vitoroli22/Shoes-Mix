
name: CI - Shoes-Mix

on:
  push:
    branches:
      - main
      - development
      - release
      - 'feature/**'

  pull_request:
    branches:
      - main
      - development
      - release

jobs:
  verificar-projeto:
    name: Verificar estrutura do projeto
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Verificar arquivos essenciais
        run: |
          test -f index.html
          test -f assets/hero.png
          echo "Arquivos essenciais encontrados!"

      - name: Finalizar validação
        run: echo "CI executado com sucesso!"
